<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Data Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>Site Data Dashboard</h1>
    <p class="subtitle">Summary, per-site totals and top devices, loaded from <code>data.json</code>.</p>
  </header>
  <main>
    <section id="summary" class="panel" aria-live="polite">
      <p class="loading">Loading summary&hellip;</p>
    </section>
    <section class="panel">
      <h2>Totals by site</h2>
      <div id="chart" class="chart" aria-live="polite">
        <p class="loading">Loading chart&hellip;</p>
      </div>
    </section>
  </main>
  <footer class="page-footer">
    <p>Data generated from the analysis pipeline.</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
